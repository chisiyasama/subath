<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karakter AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--ink:#1b1410;--paper:#fff4e6;--amber:#f59a3c;--glass:rgba(27,20,16,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#1b1410;--paper:#fff4e6;--amber:#f59a3c;--glass:rgba(27,20,16,.62)}}
:root[data-theme="dark"]{--ink:#1b1410;--paper:#fff4e6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#4a2e18,var(--ink) 70%)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#char{position:absolute;left:0;top:0;will-change:transform;cursor:grab;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
#char img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){#char img{animation:none}}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent 35%,rgba(27,20,16,.92))}
#intro h1{margin:0;font-size:clamp(30px,9vw,44px);line-height:1.02;font-weight:700;letter-spacing:-.02em;max-width:12ch}
#intro p{margin:0;max-width:34ch;line-height:1.45;opacity:.88}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:15px 20px;background:var(--amber);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#bar{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:center;gap:10px;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}
#bar button{background:var(--glass);color:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:13px 16px}
#bar button.main{background:var(--amber);color:var(--ink)}
#hint{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass);padding:9px 14px;border-radius:99px;font-size:14px;display:none;white-space:nowrap}
#note{font-size:13px;opacity:.75;min-height:1em}
#shot{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;touch-action:auto}
#shot img{max-width:100%;max-height:75%;border-radius:10px;-webkit-user-select:auto;user-select:auto}
</style>
</head>

var AR=834/720,facing='environment',stream=null,running=false;
var P={x:0,y:0,w:0,a:0,seen:0,has:false}; // posisi tampilan
var dc=document.createElement('canvas'),dg=dc.getContext('2d',{willReadFrequently:true});
ch.style.transformOrigin='50% 100%';ch.style.opacity='0';ch.style.cursor='default';
pic.addEventListener('load',function(){AR=pic.naturalHeight/pic.naturalWidth});
function draw(){
  ch.style.width=P.w+'px';
  ch.style.transform='translate('+(P.x-P.w/2)+'px,'+(P.y-P.w*AR)+'px) rotate('+P.a+'rad)';
}
function lerp(a,b,k){return a+(b-a)*k}
function map(pt,vw,vh,s){
  var W=stage.clientWidth,H=stage.clientHeight,sc=Math.max(W/vw,H/vh);
  var X=(W-vw*sc)/2+pt.x/s*sc,Y=(H-vh*sc)/2+pt.y/s*sc;
  if(facing==='user')X=W-X;
  return {x:X,y:Y,sc:sc};
}
function scan(){
  if(!running)return;
  var vw=cam.videoWidth,vh=cam.videoHeight;
  if(vw){
    var s=Math.min(1,520/vw);dc.width=Math.round(vw*s);dc.height=Math.round(vh*s);
    dg.drawImage(cam,0,0,dc.width,dc.height);
    var img=dg.getImageData(0,0,dc.width,dc.height);
    var r=window.jsQR&&jsQR(img.data,dc.width,dc.height,{inversionAttempts:'dontInvert'});
    if(r){
      var tl=map(r.location.topLeftCorner,vw,vh,s),tr=map(r.location.topRightCorner,vw,vh,s),
          bl=map(r.location.bottomLeftCorner,vw,vh,s),br=map(r.location.bottomRightCorner,vw,vh,s);
      var cx=(tl.x+tr.x+bl.x+br.x)/4,cy=(tl.y+tr.y+bl.y+br.y)/4;
      var side=Math.hypot(tr.x-tl.x,tr.y-tl.y);
      var ang=Math.atan2(tr.y-tl.y,tr.x-tl.x);
      var w=Math.max(90,Math.min(stage.clientWidth*1.4,side*2.6));
      if(!P.has){P.x=cx;P.y=cy;P.w=w;P.a=ang;P.has=true}
      else{
        var d=ang-P.a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
        P.x=lerp(P.x,cx,.45);P.y=lerp(P.y,cy,.45);P.w=lerp(P.w,w,.35);P.a+=d*.4;
      }
      P.seen=performance.now();draw();ch.style.opacity='1';$('hint').style.display='none';
    }else if(P.has&&performance.now()-P.seen>700){
      ch.style.opacity='0';P.has=false;$('hint').style.display='block';
    }
  }
  setTimeout(scan,66);
}
function openCam(){
  if(stream)stream.getTracks().forEach(function(t){t.stop()});
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject(new Error('x'));
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false}).then(function(s){
    stream=s;cam.srcObject=s;cam.style.display='block';
    cam.style.transform=facing==='user'?'scaleX(-1)':'none';
    return cam.play().catch(function(){});
  });
}
$('start').addEventListener('click',function(){
  openCam().then(function(){
    $('intro').style.display='none';$('bar').style.display='flex';$('hint').style.display='block';
    if(!running){running=true;scan()}
  }).catch(function(){
    $('note').textContent='Kamera tidak bisa dibuka. Periksa izin kamera, atau buka tautan ini langsung di Chrome (Android) atau Safari (iPhone).';
  });
});
$('flip').addEventListener('click',function(){facing=facing==='user'?'environment':'user';P.has=false;ch.style.opacity='0';openCam().catch(function(){})});
$('snap').addEventListener('click',function(){
  var W=stage.clientWidth,H=stage.clientHeight,k=2,c=document.createElement('canvas');
  c.width=W*k;c.height=H*k;var g=c.getContext('2d');g.fillStyle='#2a1a10';g.fillRect(0,0,c.width,c.height);
  if(stream&&cam.videoWidth){
    var vw=cam.videoWidth,vh=cam.videoHeight,sc=Math.max(W/vw,H/vh),dw=vw*sc,dh=vh*sc;
    g.save();if(facing==='user'){g.translate(c.width,0);g.scale(-1,1)}
    g.drawImage(cam,(W-dw)/2*k,(H-dh)/2*k,dw*k,dh*k);g.restore();
  }
  if(P.has){g.save();g.translate(P.x*k,P.y*k);g.rotate(P.a);g.drawImage(pic,-P.w/2*k,-P.w*AR*k,P.w*k,P.w*AR*k);g.restore()}
  c.toBlob(function(b){
    if(!b)return;var f=new File([b],'foto-ar.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
    else{$('shotimg').src=URL.createObjectURL(b);$('shot').style.display='flex'}
  },'image/png');
});
$('close').addEventListener('click',function(){$('shot').style.display='none'});
})();
</script>

</body>
</html>
